const bars=(lab,val,col)=>{const m=Math.max(1,...val);return'<div class="bars">'+val.map((v,i)=>`<div title="${esc(lab[i])}: ${v}"><em>${v||''}</em><i style="height:${Math.round(v/m*100)}%;${col?'background:'+col:''}"></i><span>${esc(lab[i])}</span></div>`).join('')+'</div>'};
const hbar=(rows,top)=>{rows=rows.slice(0,top||10);const m=Math.max(1,...rows.map(r=>r[1]));return rows.length?rows.map(r=>`<div class="hb"><span title="${esc(r[0])}">${esc(r[0])}</span><i style="width:${Math.round(r[1]/m*60)+2}%"></i><em>${r[1]}</em></div>`).join(''):'<div class="off">তথ্য নেই</div>'};
const PC=['#16a34a','#f59e0b','#0ea5e9','#ef4444','#14b8a6','#a3e635','#6366f1','#f97316'];
const pie=items=>{const tot=items.reduce((a,b)=>a+b[1],0)||1;let a=0;const seg=items.map((it,i)=>{const s=a;a+=it[1]/tot*100;return PC[i%8]+' '+s+'% '+a+'%'}).join(',');return`<div class="pie"><u style="background:conic-gradient(${seg||'#ddd 0 100%'})"></u><div>${items.map((it,i)=>`<p><b style="background:${PC[i%8]}"></b>${esc(it[0])}: <strong>${it[1]}</strong> (${Math.round(it[1]/tot*100)}%)</p>`).join('')}</div></div>`};
const tally=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
