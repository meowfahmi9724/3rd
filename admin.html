      const ow={};document.querySelectorAll('[data-it]').forEach(c=>{if(c.checked)ow[c.dataset.it]=1});const old=(u.inv&&u.inv.own)||{};Object.keys(old).forEach(k=>{if(!STORE.find(q=>q.id===k)||STORE.find(q=>q.id===k).hid)ow[k]=old[k]});
      const eq={...((u.inv&&u.inv.eq)||{})};Object.keys(eq).forEach(s=>{const it=STORE.find(q=>q.id===eq[s]);if(it&&!it.hid&&!ow[it.id])delete eq[s]});
      if($('e_cn').value!==''||u.cn!=null){o.cn=Math.max(0,+$('e_cn').value||0);o.stk=u.stk||0;o.lst=u.lst||'';o.inv={own:ow,eq}}else if(Object.keys(ow).length!==Object.keys(old).length){msg('কয়েন সিঙ্ক না থাকায় আইটেম বদলানো গেল না (প্লেয়ার একবার লগইন করুক)',4500);return}
      const m=$('e_msg').value.trim();if(m)o.msg={text:m,t:Date.now()};
      try{await fs.doc('users/'+id).set(o,{merge:true});Object.assign(u,o);fs.doc('lb/w'+wk()+'/p/'+id).update({name:o.name,dist:o.nat==='BD'?o.dist:''}).catch(()=>{});$('ed').classList.add('hide');msg('✅ সেভ হয়েছে — প্লেয়ারের গেমে সাথে সাথে আপডেট হবে');render()}catch(x){msg('সেভ হয়নি: '+x.message,5000)}}}}
// ---------- লিডারবোর্ড ----------
async function rLb(){const w=wk()-lbW;$('main').innerHTML=`<div class="card"><div class="row"><select id="lbw">${[0,1,2,3,4].map(i=>`<option value="${i}" ${i===lbW?'selected':''}>${i?i+' সপ্তাহ আগের':'চলতি সপ্তাহ'}</option>`).join('')}</select><button class="b d" id="lbr">🧹 পুরো সপ্তাহ রিসেট</button></div><div id="lbl" style="margin-top:8px">লোড…</div></div>`;
  $('lbw').onchange=e=>{lbW=+e.target.value;rLb()};
  const load=async()=>{try{const q=await fs.collection('lb/w'+w+'/p').orderBy('goals','desc').limit(200).get();$('lbl').innerHTML=q.size?`<div class="sc"><table><tr><th>#</th><th>নাম</th><th>জেলা</th><th>গোল</th><th></th></tr>${q.docs.map((d,i)=>{const r=d.data();return`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.dist)}</td><td>${r.goals}</td><td><button class="b s" data-g="${d.id}">✏️ গোল</button> <button class="b d" data-r="${d.id}">সরাও</button></td></tr>`}).join('')}</table></div>`:'<div class="off">এই সপ্তাহে কেউ নেই</div>'}catch(e){$('lbl').textContent='লোড হয়নি: '+e.message}};await load();
  $('main').onclick=async e=>{const g=e.target.closest('[data-g]'),r=e.target.closest('[data-r]');
    if(g){const v=prompt('নতুন গোল সংখ্যা?');if(v!==null&&v!==''){await fs.doc('lb/w'+w+'/p/'+g.dataset.g).update({goals:+v||0});msg('আপডেট হয়েছে');load()}}
    if(r&&confirm('লিডারবোর্ড থেকে এই প্লেয়ারকে সরাবে?')){await fs.doc('lb/w'+w+'/p/'+r.dataset.r).delete();msg('সরানো হয়েছে');load()}};
  $('lbr').onclick=async()=>{if(!confirm('এই সপ্তাহের পুরো লিডারবোর্ড মুছে যাবে। নিশ্চিত?'))return;const q=await fs.collection('lb/w'+w+'/p').get();for(let i=0;i<q.docs.length;i+=400){const b=fs.batch();q.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}msg('রিসেট হয়েছে');load()}}
// ---------- স্টোর ----------
function rSt(){const pr=CFG.pr||{},hide=CFG.hide||[];
  $('main').innerHTML=`<div class="card"><h3>🛍️ স্টোরের দাম ও আইটেম চালু/বন্ধ</h3><div class="off" style="margin-bottom:6px">দাম ফাঁকা = ডিফল্ট দাম। "লুকাও" টিক দিলে স্টোরে আইটেমটি দেখাবে না (যাদের আছে তাদের থাকবে)।</div><div class="sc"><table><tr><th>আইটেম</th><th>ধরন</th><th>ডিফল্ট</th><th>নতুন দাম</th><th>লুকাও</th></tr>${STORE.filter(q=>!q.hid).map(q=>`<tr><td>${q.e} ${esc(q.n)}</td><td>${SLOT[q.slot]}</td><td>${q.p}</td><td><input data-p="${q.id}" type="number" value="${pr[q.id]!=null?pr[q.id]:''}" style="width:90px"></td><td><input type="checkbox" data-h="${q.id}" ${hide.includes(q.id)?'checked':''} style="width:auto"></td></tr>`).join('')}</table></div><button class="b" id="stS" style="margin-top:10px">💾 সেভ করো</button></div>`;
  $('stS').onclick=async()=>{const p={},h=[];document.querySelectorAll('[data-p]').forEach(i=>{if(i.value!=='')p[i.dataset.p]=+i.value});document.querySelectorAll('[data-h]').forEach(i=>{if(i.checked)h.push(i.dataset.h)});await fs.doc('cfg/app').set({pr:p,hide:h},{mergeFields:['pr','hide']});CFG.pr=p;CFG.hide=h;msg('✅ সবার গেমে আপডেট হয়েছে')}}
// ---------- থিম ও সেটিংস ----------
function rCfg(){const off=CFG.off||[],e=CFG.eco||{};
  $('main').innerHTML=`<div class="g2"><div class="card"><h3>🎨 অ্যাপের থিম</h3><label>অ্যাকসেন্ট রঙ (বাটন/হাইলাইট)</label><div class="row"><input id="c_ac" type="color" value="${CFG.ac||'#7c3aed'}"><button class="b s" id="c_ac0">ডিফল্ট</button></div><label>মাঠের ব্যাকগ্রাউন্ড রঙ</label><div class="row"><input id="c_pitch" type="color" value="${CFG.pitch||'#17653a'}"><button class="b s" id="c_pitch0">ডিফল্ট</button></div><label>ডিফল্ট মোড (যারা নিজে বাছেনি তাদের জন্য)</label><select id="c_mode">${[['','অটো'],['light','লাইট'],['dark','ডার্ক']].map(x=>`<option value="${x[0]}" ${(CFG.mode||'')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
  <div class="card"><h3>📣 ঘোষণা ও রক্ষণাবেক্ষণ</h3><label>হোম স্ক্রিনে ঘোষণা বার (ফাঁকা = নেই)</label><input id="c_ann" value="${esc(CFG.ann||'')}"><label><input type="checkbox" id="c_maint" ${CFG.maint?'checked':''} style="width:auto"> 🛠️ মেইনটেন্যান্স মোড (সবার খেলা বন্ধ)</label><input id="c_mt" placeholder="মেইনটেন্যান্স বার্তা" value="${esc(CFG.mtMsg||'')}"></div>
  <div class="card"><h3>🎛️ ফিচার চালু/বন্ধ</h3>${[['cpu','🤖 কম্পিউটার ম্যাচ'],['career','🏅 ক্যারিয়ার ম্যাচ'],['team','👥 টিম ম্যাচ'],['store','🛍️ স্টোর'],['friends','👥 ফ্রেন্ডস']].map(([k,l])=>`<label style="color:var(--tx);font-size:14px"><input type="checkbox" data-o="${k}" ${off.includes(k)?'':'checked'} style="width:auto"> ${l} চালু</label>`).join('')}</div>
  <div class="card"><h3>🪙 কয়েন ইকোনমি</h3><div class="row"><div><label>সাইন-আপ বোনাস</label><input id="x_sg" type="number" value="${e.sg??''}" placeholder="১০০"></div><div><label>CPU জিতলে</label><input id="x_wc" type="number" value="${e.wc??''}" placeholder="৫"></div></div><div class="row"><div><label>অনলাইন ম্যাচ জিতলে</label><input id="x_wo" type="number" value="${e.wo??''}" placeholder="১০"></div><div><label>কার্ল শটের খরচ</label><input id="x_cc" type="number" value="${e.cc??''}" placeholder="২০"></div></div><div class="off" style="font-size:11px;margin-top:6px">ফাঁকা = ডিফল্ট</div></div></div><button class="b" id="c_s">💾 সব সেভ করো (সবার গেমে আপডেট হবে)</button>`;
  $('c_ac0').onclick=()=>{CFG.ac='';$('c_ac').value='#7c3aed';$('c_ac').dataset.z=1};$('c_pitch0').onclick=()=>{$('c_pitch').value='#17653a';$('c_pitch').dataset.z=1};$('c_ac').oninput=()=>delete $('c_ac').dataset.z;$('c_pitch').oninput=()=>delete $('c_pitch').dataset.z;
  $('c_s').onclick=async()=>{const o={ac:($('c_ac').dataset.z||(!CFG.ac&&$('c_ac').value==='#7c3aed'))?'':$('c_ac').value,pitch:($('c_pitch').dataset.z||(!CFG.pitch&&$('c_pitch').value==='#17653a'))?'':$('c_pitch').value,mode:$('c_mode').value,ann:$('c_ann').value.trim(),maint:$('c_maint').checked,mtMsg:$('c_mt').value.trim(),off:[...document.querySelectorAll('[data-o]')].filter(i=>!i.checked).map(i=>i.dataset.o),eco:{}};
    ['sg','wc','wo','cc'].forEach(k=>{const v=$('x_'+k).value;if(v!=='')o.eco[k]=+v});
    try{await fs.doc('cfg/app').set(o,{mergeFields:['ac','pitch','mode','ann','maint','mtMsg','off','eco']});Object.assign(CFG,o);msg('✅ সবার গেমে আপডেট হয়েছে')}catch(x){msg('সেভ হয়নি: '+x.message,5000)}}}
// ---------- টুলস ----------
function rTools(){$('main').innerHTML=`<div class="g2">
  <div class="card"><h3>🎁 সবাইকে উপহার</h3>${giftForm('ga')}<button class="b" id="ga_s" style="margin-top:10px">🎁 সবাইকে পাঠাও (${U.length} জন)</button><div class="off" style="font-size:11px;margin-top:6px">যাদের ওয়ালেট সিঙ্ক হয়নি তারাও গেম খুললেই পপ-আপসহ পাবে।</div></div>
  <div class="card"><h3>🎯 একজনকে উপহার</h3><label>প্লেয়ার (ইমেইল বা নাম)</label><input id="gi_q" list="gi_l" placeholder="ইমেইল / নাম লিখে বাছুন"><datalist id="gi_l">${U.slice(0,600).map(u=>`<option value="${esc(u.email||u.name)}">${esc(u.name)}</option>`).join('')}</datalist>${giftForm('gi')}<button class="b" id="gi_s" style="margin-top:10px">🎁 পাঠাও</button><div class="off" style="font-size:11px;margin-top:6px">প্লেয়ার-তালিকায় কারো সারিতে ট্যাপ করেও আলাদা উপহার পাঠানো যায়।</div></div>
  <div class="card"><h3>📢 সবাইকে পপ-আপ বার্তা</h3><input id="t_m" placeholder="বার্তা লিখো"><button class="b" id="t_b" style="margin-top:8px">পাঠাও</button></div>
  <div class="card"><h3>🔍 ব্যান করা প্লেয়ার</h3>${U.filter(u=>u.ban).map(u=>`<div>${esc(u.name)} — ${esc(u.ban)} <button class="b s" data-un="${u.id}">আনব্যান</button></div>`).join('')||'<div class="off">কেউ নেই</div>'}</div></div>`;
  const chunk=async(rows,fn)=>{for(let i=0;i<rows.length;i+=400){const b=fs.batch();rows.slice(i,i+400).forEach(r=>fn(b,r));await b.commit()}};
  $('ga_s').onclick=async()=>{const g=readGift('ga');if(!g.coins&&!g.items.length&&!g.text)return msg('কয়েন, আইটেম বা বার্তা দিন',3000);if(!confirm(U.length+' জনকে পাঠাবে: '+gDesc(g)+'। নিশ্চিত?'))return;if(await sendGift(U.map(u=>u.id),g))msg('✅ সবাইকে পাঠানো হয়েছে — গেম খুললেই পপ-আপ পাবে',4500)};
  $('gi_s').onclick=async()=>{const q=$('gi_q').value.trim().toLowerCase();if(!q)return msg('প্লেয়ার বাছুন');let m=U.filter(x=>(x.email||'').toLowerCase()===q);if(!m.length)m=U.filter(x=>(x.name||'').toLowerCase()===q);
    if(!m.length)return msg('এই ইমেইল/নামে কাউকে পাওয়া যায়নি');if(m.length>1)return msg('একই নামে একাধিক প্লেয়ার — ইমেইল দিয়ে খুঁজুন',4000);const g=readGift('gi');if(await sendGift([m[0].id],g))msg('🎁 '+m[0].name+'-কে পাঠানো হয়েছে: '+gDesc(g),4500)};
  $('t_b').onclick=async()=>{const m=$('t_m').value.trim();if(!m||!confirm('সবাইকে পপ-আপ যাবে। নিশ্চিত?'))return;const t=Date.now();await chunk(U,(b,u)=>b.set(fs.doc('users/'+u.id),{msg:{text:m,t}},{merge:true}));msg('✅ পাঠানো হয়েছে')};
  $('main').onclick=async e=>{const b=e.target.closest('[data-un]');if(b){await fs.doc('users/'+b.dataset.un).set({ban:''},{merge:true});U.find(x=>x.id===b.dataset.un).ban='';msg('আনব্যান হয়েছে');rTools()}}}
</script></body></html>
